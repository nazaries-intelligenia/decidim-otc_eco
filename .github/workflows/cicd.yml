name: RoR app CI/CD

on:
  push:
    branches:
      - main
      - develop
      - docker

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub 🐳
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image 🚀
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ vars.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.run_number }}_${{ steps.vars.outputs.sha_short }}

      - name: Lanza webhook de Portainer 🔁
        if: success()
        run: |
          curl -X POST ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
          curl -X POST ${{ secrets.PORTAINER_WEBHOOK_SIDEKIQ }}
