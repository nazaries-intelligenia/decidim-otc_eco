name: RoR app CI/CD

on:
  push:
    branches:
      - main
      - develop
      - docker
  pull_request: {}

jobs:
  docker-build-and-push-develop-staging:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/docker'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub 🐳
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image 🚀
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          tags: |
            ${{vars.DOCKERHUB_REPOSITORY}}:${{ vars.IMAGE_TAG }}
            ${{vars.DOCKERHUB_REPOSITORY}}:${{ github.run_number }}_${{ steps.vars.outputs.sha_short }}

      - name: Lanza webhook de Portainer 🔁
        if: success()
        run: |
          curl -X POST ${{ vars.PORTAINER_WEBHOOK_BACKEND }}
          curl -X POST ${{ vars.PORTAINER_WEBHOOK_SIDEKIQ }}

  docker-build-and-push-main-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub 🐳
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image 🚀
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          tags: |
            ${{vars.DOCKERHUB_REPOSITORY}}:${{ vars.IMAGE_TAG }}
            ${{vars.DOCKERHUB_REPOSITORY}}:${{ github.run_number }}_${{ steps.vars.outputs.sha_short }}

      - name: Lanza webhook de Portainer 🔁
        if: success()
        run: |
          curl -X POST ${{ vars.PORTAINER_WEBHOOK_PROD }}
          curl -X POST ${{ vars.PORTAINER_WEBHOOK_SIDEKIQ }}