    events:
      groups:
        demoted_membership:
          email_intro: An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has removed your admin permissions for that energy community.
          email_outro: You have received this notification because you are a member
            of this energy community.
          email_subject: You are no longer an admin of the energy community %{user_group_name}.
          notification_title: You are no longer an admin of the energy community <a
            href="%{resource_path}">%{user_group_name}</a>.
        invited_to_group:
          email_intro: An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has invited you to join it.
          email_outro: You have received this notification because you have been invited
            to an energy community. Please, check the Energy communities tab in your
            profile to accept the invitation.
          email_subject: You have been invited to join the energy community %{user_group_name}
          notification_title: You have been invited to join the energy community <a
            href="%{resource_path}">%{user_group_name}</a>. Check the <a href="%{groups_profile_tab_path}">Energy
            communities tab</a> in your profile to accept the invitation!
        join_request_accepted:
          email_intro: Congratulations! An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has accepted your request to join it.
          email_outro: You have received this notification because your request to
            join the energy community has been updated.
          email_subject: Your request to join the energy community %{user_group_name}
            has been accepted!
          notification_title: You have been accepted in the energy community <a href="%{resource_path}">%{user_group_name}</a>.
        join_request_created:
          email_intro: Someone requested to join the energy community %{user_group_name}.
            You can accept or reject it from <a href="%{resource_url}">energy community
            members page</a>.
          email_outro: You have received this notification because you manage the
            energy community "%{user_group_name}".
          email_subject: Someone has requested to join the energy community %{user_group_name}
          notification_title: Someone has requested to join the energy community %{user_group_name}.
            You can accept or reject the request from <a href="%{resource_path}">the
            energy community members page</a>.
        join_request_rejected:
          email_intro: An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has rejected your request to join it.
          email_outro: You have received this notification because your request to
            join the energy community has been updated.
          email_subject: Your request to join the energy community %{user_group_name}
            has been rejected!
          notification_title: Your request to join the energy community <a href="%{resource_path}">%{user_group_name}</a>
            has been rejected.
        promoted_to_admin:
          email_intro: An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has granted you admin permissions for this energy community.
          email_outro: You have received this notification because you are a member
            of this energy community.
          email_subject: You are now an admin of the energy community %{user_group_name}!
          notification_title: You are now an admin of the energy community <a href="%{resource_path}">%{user_group_name}</a>.
        removed_from_group:
          email_intro: An energy community admin of <a href="%{resource_url}">%{user_group_name}</a>
            has removed you from it.
          email_outro: You have received this notification because you were a member
            of that energy community.
          email_subject: You have been removed from the energy community %{user_group_name}!
          notification_title: You have been removed from the energy community <a href="%{resource_path}">%{user_group_name}</a>.
        user_group_created:
          email_intro: A new energy community has been created with the name %{user_group_name}.
            You can now verify it, if appropriate, in the <a href="%{groups_admin_url}">admin
            panel</a>.
          email_subject: A new energy community has been created
          notification_title: The %{user_group_name} energy community has been created.
            You can now verify it in the <a href="%{groups_admin_path}">admin panel</a>.
        user_group_updated:
          email_intro: An energy community with the name %{user_group_name} has updated
            its profile, leaving it unverified. You can now verify it in the <a href="%{groups_admin_url}">admin
            panel</a>.
          email_subject: An energy community has updated its profile
          notification_title: The %{user_group_name} energy community has updated
            its profile, leaving it unverified. You can now verify it in the <a href="%{groups_admin_path}">admin
            panel</a>.
